services:
  # MQTT Broker
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: oc4_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: always

  # Backend API
  backend:
    build: ./backend
    container_name: oc4_backend
    ports:
      - "8080:8000"
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    depends_on:
      - mqtt
    volumes:
      - ./data:/app/data
    restart: always

  # Frontend Web App
  frontend:
    build: ./web
    container_name: oc4_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  # InfluxDB (Time Series Database)
  influxdb:
    image: influxdb:2.7
    container_name: oc4_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=oc4_org
      - DOCKER_INFLUXDB_INIT_BUCKET=oc4_bucket
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: always

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: oc4_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: always

volumes:
  influxdb_data:
  grafana_data:
