# OC4 Digital Twin · cliente móvil
#
# Un único servicio: el servidor Node sirve la SPA ya compilada y los endpoints
# de telemetría (`/api`). La inferencia corre en el dispositivo, así que no hay
# backend aparte ni base de datos.
#
# Se publica bajo un **subpath** (`/oc4-dt-mobile/`) delante de nginx:
#
#     location /oc4-dt-mobile/ { proxy_pass http://127.0.0.1:8790/; … }
#
# El prefijo va horneado **en el build** (`PUBLIC_BASE`): el HTML pide
# `/oc4-dt-mobile/assets/…` y nginx recorta el prefijo al reenviar. Por eso el
# contenedor sirve la app en su raíz y no hay que tocar más.
services:
  oc4-dt-mobile:
    build:
      context: .
      args:
        PUBLIC_BASE: /oc4-dt-mobile/
        VITE_DEFAULT_MODEL_URL: /models/yolo-pose-n-200.onnx
    image: oc4-mobile:latest
    container_name: oc4-dt-mobile
    restart: unless-stopped
    # Solo en loopback: nginx es el que escucha en Internet.
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      PORT: "8790"
      SERVE_DIST: "1"
